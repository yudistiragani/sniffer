[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "media-sniffer"
version = "0.1.0"
description = "Device-scoped Instagram capture, automation, and Beanstalk executor."
requires-python = ">=3.12,<3.14"
dependencies = [
    "filelock>=3.16",
    "greenstalk>=2.1",
    "pydantic>=2.10",
    "PyYAML>=6.0.2",
    "typer>=0.15",
]

[project.optional-dependencies]
automation = ["Appium-Python-Client>=5,<6"]
capture = ["mitmproxy>=11,<13"]
frida = ["frida>=17,<18"]

[project.scripts]
sniffer = "sniffer.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/sniffer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
